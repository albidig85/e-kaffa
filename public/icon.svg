<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#065f46" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="whiteGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#022c22" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Subtle Islamic Geometric Octagon Border inside -->
  <rect x="24" y="24" width="464" height="464" rx="96" fill="none" stroke="#34d399" stroke-width="4" stroke-opacity="0.3" />
  
  <!-- Central Glow / Emblem Container -->
  <circle cx="256" cy="230" r="148" fill="#047857" fill-opacity="0.5" filter="url(#shadow)" />
  <circle cx="256" cy="230" r="140" fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-dasharray="12 6" />

  <!-- Heart & Helping Hands (Kifayah & Santunan Symbol) -->
  <g transform="translate(256, 224) scale(4.8) translate(-12, -12)" filter="url(#shadow)">
    <!-- Heart shape behind -->
    <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z" fill="url(#goldGrad)" opacity="0.28" />
    
    <!-- HeartHandshake Lucide vector path in white -->
    <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z" fill="none" stroke="url(#whiteGrad)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M12 5 9.04 7.96a2.17 2.17 0 0 0 0 3.08c.82.82 2.13.85 3 .07l2.07-1.9a2.82 2.82 0 0 1 3.18 0l2.57 2.24" fill="none" stroke="url(#goldGrad)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    <path d="m18 15-2-2" fill="none" stroke="url(#whiteGrad)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    <path d="m15 18-2-2" fill="none" stroke="url(#whiteGrad)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Typography / Brand Name -->
  <text x="256" y="420" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="900" font-size="44" fill="#ffffff" letter-spacing="1">e-Kafah</text>
  <text x="256" y="452" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="600" font-size="19" fill="#a7f3d0" letter-spacing="3">RUKUN KIFAYAH</text>
</svg>
